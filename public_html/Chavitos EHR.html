<style>
  html, body, #root { height: 100%; }

    margin: 0;

  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }

  ::-webkit-scrollbar-thumb:hover { background: rgba(15,23,42,0.28); background-clip: padding-box; border: 2px solid transparent; }

  @keyframes fade-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .animate-fade-in { animation: fade-in 220ms ease-out; }

  input[type="date"] {
    color-scheme: light;
  }
  /* Mono font for elements marked with font-mono */
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
